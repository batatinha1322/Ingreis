<<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Simple Past Challenge</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>🎮 Simple Past Challenge</h1>

<div id="start">
<button onclick="startGame()">Start Game</button>
</div>

<div id="game" class="hidden">

<div class="progress">
<div id="progress-bar"></div>
</div>

<div class="timer">
<div id="timer-bar"></div>
</div>

<h2 id="question"></h2>

<div id="answers"></div>

<input id="text-answer" class="hidden" placeholder="Type your answer">

<button id="submit-text" class="hidden" onclick="submitText()">Submit</button>

<p id="score">Score: 0</p>

</div>

<div id="end" class="hidden">

<h2 id="final-score"></h2>

<button onclick="location.reload()">Play Again</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
