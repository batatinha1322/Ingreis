<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Simple Past Quiz</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Simple Past Quiz</h1>

  <!-- INDICADOR DE PERGUNTA -->
<div id="questionCounter">
Pergunta <span id="currentQuestion">1</span> / <span id="totalQuestions">25</span>
</div>

<!-- BARRA DE PROGRESSO -->
<div id="progress-container">
<div id="progress-bar"></div>
</div>

<!-- TIMER -->
<div id="timer">Tempo: 0</div>

<!-- PERGUNTA -->
<div id="question"></div>

<!-- RESPOSTAS -->
<div id="answers"></div>

<!-- FEEDBACK -->
<div id="feedback"></div>

<!-- TELA FINAL -->
<div id="final" class="hidden">
<h2>Fim do Quiz!</h2>

<p id="score"></p>
<p id="hits"></p>
<p id="maxScore"></p>

<button onclick="restartQuiz()">Recomeçar</button>
</div>

<script src="script.js"></script>

</body>
</html>
