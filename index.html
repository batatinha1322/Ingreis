<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Simple Past Challenge</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Simple Past Challenge</h1>

<div id="quiz-container">

<div id="progressText"></div>

<div class="progressBar">
<div id="progressFill"></div>
</div>

<div class="timerBar">
<div id="timerFill"></div>
</div>

<h2 id="question"></h2>

<div id="answers"></div>

<input id="textAnswer" placeholder="Type answer">

<button id="submitBtn">Submit</button>

<div id="feedback"></div>

<p id="score">Score: 0</p>

</div>

<div id="finalScreen" class="hidden">

<h2>Quiz Finished!</h2>

<p id="finalScore"></p>

<p id="correctCount"></p>

<p id="maxScore"></p>

<button onclick="location.reload()">Play Again</button>

</div>

<script src="script.js"></script>

</body>
</html>
