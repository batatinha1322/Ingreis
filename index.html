<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Simple Past Quiz</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="startScreen">
<h1>Simple Past Quiz</h1>
<button id="playBtn" onclick="startQuiz()">▶ Play</button>
<div id="credits">Feito por Arthur Emanuel</div>
</div>

<div id="quizContainer" class="hidden">

<h1>Simple Past Quiz</h1>

  <div id="questionCounter">
Pergunta <span id="currentQuestion">1</span> / <span id="totalQuestions">25</span>
</div>

<div id="progress-container">
<div id="progress-bar"></div>
</div>

<div id="timer">Tempo: 0</div>

  <div id="scoreBoard">
Pontuação: <span id="scoreValue">0</span>
</div>

<div id="question"></div>

<div id="answers"></div>

<div id="feedback"></div>

</div>

<div id="final" class="hidden">
<h2>Fim do Quiz!</h2>

<p id="score"></p>
<p id="hits"></p>
<p id="maxScore"></p>

<button onclick="restartQuiz()">Recomeçar</button>
</div>

<script src="script.js"></script>

</body>
</html>
